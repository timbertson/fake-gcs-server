# NOTE: This file is generated by chored

'on':
  workflow_dispatch: {}
  push:
    branches:
      - docker
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup chored
        uses: timbertson/chored-setup@v1
      - run: ./chored 'docker' login --json "$OPTS"
        env:
          OPTS: '{"user":"${{ github.actor }}","token":"${{ secrets.GITHUB_TOKEN }}"}'
      - run: ./chored 'docker' build --json "$OPTS"
        env:
          OPTS: '{"push":true}'
